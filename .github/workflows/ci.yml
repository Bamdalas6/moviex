name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  cloudflare:
    name: Cloudflare Worker build (size check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with OpenNext
        run: npx opennextjs-cloudflare build
      - name: Measure Worker size (dry run, no deploy)
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run 2>&1 | tee wrangler.log
          gzip_kib=$(grep -oP 'gzip:\s*\K[0-9.]+(?=\s*KiB)' wrangler.log | tail -1)
          echo "::notice title=Worker size::${gzip_kib} KiB gzipped (Workers Free limit: 3072 KiB, Paid: 10240 KiB)"
          echo "### Worker size: ${gzip_kib} KiB gzipped (Free limit 3072 KiB)" >> "$GITHUB_STEP_SUMMARY"
          awk -v s="$gzip_kib" 'BEGIN { exit !(s <= 3072) }' || { echo "::error::Worker exceeds the Workers Free 3 MiB limit"; exit 1; }
